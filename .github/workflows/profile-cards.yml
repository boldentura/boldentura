name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, 10:17 in Da Nang
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.json, scripts/**, assets/**, fonts/src/**, .github/workflows/**]

permissions:
  contents: write

concurrency: profile-cards

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # latest main, not the trigger SHA: a queued run must see the previous run's commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_data.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit data and cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards README.md
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Refresh profile cards"
          git push
